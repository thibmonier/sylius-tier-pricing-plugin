sylius_twig_hooks:
    hooks:
        # Rule form (create and update pages of the rule CRUD).
        'tmonier_tier_pricing_admin.tier_price_rule.create.content.form.sections.general':
            default:
                enabled: false
            fields:
                template: '@TmonierSyliusTierPricingPlugin/admin/tier_price_rule/form/fields.html.twig'
                priority: 0

        'tmonier_tier_pricing_admin.tier_price_rule.update.content.form.sections.general':
            default:
                enabled: false
            fields:
                template: '@TmonierSyliusTierPricingPlugin/admin/tier_price_rule/form/fields.html.twig'
                priority: 0

        # "Volume pricing" tab of the product form.
        'sylius_admin.product.update.content.form.side_navigation':
            tmonier_tier_pricing:
                template: '@TmonierSyliusTierPricingPlugin/admin/product/side_navigation.html.twig'
                priority: 50

        'sylius_admin.product.update.content.form.sections':
            tmonier_tier_pricing:
                template: '@TmonierSyliusTierPricingPlugin/admin/product/section.html.twig'
                priority: 50
